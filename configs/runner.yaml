# act_runner configuration.
# Any key you omit falls back to act_runner's built-in default, so this
# file only needs to contain the things you actually want to change.
# Labels are NOT set here — they come from RUNNER_LABELS in settings.env.

log:
  # trace | debug | info | warn | error | fatal
  level: info

runner:
  file: .runner
  # How many jobs a single runner executes at the same time.
  capacity: 1
  # Hard ceiling for a single job.
  timeout: 3h
  fetch_timeout: 5s
  fetch_interval: 2s

cache:
  # Enables actions/cache support (embedded cache server).
  enabled: true

container:
  # ── Fix for "could not resolve host: gitea" during actions/checkout ──
  # In dind mode the job (guest) containers run in the runner's own inner
  # Docker daemon, isolated from the compose network. "host" makes them
  # share the runner container's network namespace — which IS attached to
  # gitea-net — so `gitea`, `db`, etc. resolve from inside jobs.
  network: host
  # Run job containers in privileged mode (rarely needed).
  privileged: false
  # Pull job images even when present locally.
  force_pull: false
