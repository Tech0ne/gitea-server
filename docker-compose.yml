name: gitea-stack

networks:
  gitea-net:
    driver: bridge

volumes:
  db_data:
  gitea_data:
  gitea_config:

services:
  db:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      # Postgres 18+: /var/lib/postgresql/<major>/docker
      # Postgres <=17: /var/lib/postgresql/data.
      - db_data:/var/lib/postgresql
    networks: [gitea-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  config-init:
    image: ${GITEA_IMAGE}
    user: "0:0"
    restart: "no"
    environment:
      APP_NAME: ${APP_NAME}
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GITEA_DOMAIN: ${GITEA_DOMAIN}
      GITEA_ROOT_URL: ${GITEA_ROOT_URL}
      GITEA_DISABLE_REGISTER: ${GITEA_DISABLE_REGISTER}
      SSH_PORT: ${SSH_PORT}
    volumes:
      - gitea_config:/etc/gitea
      - ./configs/instance.ini.tmpl:/tmpl/instance.ini.tmpl:ro
      - ./configs/render-config.sh:/render-config.sh:ro
    entrypoint: ["/bin/sh", "/render-config.sh"]

  gitea:
    image: ${GITEA_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      config-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_REGISTRATION_TOKEN}
    volumes:
      - gitea_data:/var/lib/gitea
      - gitea_config:/etc/gitea
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${HTTP_PORT}:3000"
      - "${SSH_PORT}:2222"
    networks: [gitea-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  gitea-init:
    image: ${GITEA_IMAGE}
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      GITEA_WORK_DIR: /var/lib/gitea
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL}
    volumes:
      - gitea_data:/var/lib/gitea
      - gitea_config:/etc/gitea
    networks: [gitea-net]
    user: "1000:1000"
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        CONF=/etc/gitea/app.ini                # rootless config location
        echo "Ensuring admin user '$$GITEA_ADMIN_USER' exists..."
        if gitea --config "$$CONF" admin user create \
             --username "$$GITEA_ADMIN_USER" \
             --password "$$GITEA_ADMIN_PASSWORD" \
             --email    "$$GITEA_ADMIN_EMAIL" \
             --admin --must-change-password=false ; then
          echo "Admin user created."
        else
          echo "Admin user already exists (or was skipped) - continuing."
        fi

  runner:
    image: ${RUNNER_IMAGE}
    privileged: true
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_REGISTRATION_TOKEN}
      GITEA_RUNNER_LABELS: ${RUNNER_LABELS}
      CONFIG_FILE: /config.yaml
    volumes:
      - ./configs/runner.yaml:/config.yaml:ro
    networks: [gitea-net]
    deploy:
      replicas: ${RUNNER_REPLICAS}
